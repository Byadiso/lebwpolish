 for(let i=0;i<28;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=C.dayKey(d.getTime()),info=stats.days[key],active=!!info?.attempts;calendar+=`<div class="day ${active?'active':''} ${key===C.dayKey()?'today':''}" title="${e(d.toLocaleDateString())}: ${info?.attempts||0} attempts" aria-label="${e(d.toLocaleDateString())}: ${info?.attempts||0} attempts">${d.getDate()}</div>`;}
 const dayNames=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return `<div class="calendar-label">${e(d.toLocaleDateString(undefined,{weekday:'short'}))}</div>`;}).join('');
 $('main').innerHTML=`<div class="progress-grid"><div class="big-stat">${icon('book')}<b>${mastered}</b><span>Words mastered<br>Unique target forms at mastery 5</span></div><div class="big-stat">${icon('target')}<b>${accuracy}%</b><span>Accepted-answer accuracy<br>${stats.correct} / ${stats.attempts} attempts, including ${stats.almost} “almost”</span></div><div class="big-stat">${icon('flame')}<b>${C.streak(stats.days)}</b><span>Current daily streak<br>Practise today to keep your rhythm</span></div><div class="big-stat">${icon('trophy')}<b>${stats.xp}</b><span>Total Cloze XP<br>Level ${Math.floor(stats.xp/100)+1} · ${started} sentences started</span></div></div><div class="grid"><section class="card"><span class="kicker">SHOWING UP COUNTS</span><h2 style="margin-top:12px">Your last four weeks</h2><p class="small-note" style="margin-top:10px">Any scored practice attempt counts. Free play is a relaxed extra. Outlined cells show practice; the double outline marks today.</p><div class="calendar" aria-label="Practice calendar for the last 28 days">${dayNames}${calendar}</div></section><section class="card"><span class="kicker">GROWING RECALL</span><h2 style="margin-top:12px">Mastery garden</h2><div class="distribution">${distribution.map((n,i)=>`<div class="distribution-row"><span>Level ${i}${i===5?' · ready':''}</span><div class="bar"><i style="width:${started?n/started*100:0}%"></i></div><b>${n}</b></div>`).join('')}</div><p class="small-note">Level 0 needs another look. Levels 1–5 return after 1, 2, 4, 8, and 16 days. These are practice milestones, not B1 exam scores.</p></section></div><section class="card" style="margin-top:22px"><h3>Keep a copy of your progress.</h3><p class="help">Export your sentences, mastery, review dates, statistics, and settings. A backup can be restored in another browser. Restoring replaces this game’s data only.</p><div class="actions"><button class="primary" id="export-backup">${icon('download')} Export backup</button><label class="secondary file-label">${icon('upload')} Choose backup<input type="file" id="backup-file" accept=".json,application/json" aria-label="Choose a Cloze progress backup"></label></div><div id="backup-preview"></div></section>`;
 $('export-backup').onclick=exportBackup;$('backup-file').onchange=previewBackup;renderBackupPreview();
}
function renderLibrary(){
 $('main').innerHTML=`<div class="library-toolbar"><input type="search" class="search" id="library-search" placeholder="Find a word or sentence…" aria-label="Search sentence library" value="${e(search)}"><select class="search" style="flex:0 1 170px" id="topic-filter" aria-label="Filter sentence topic"><option value="all">All topics</option>${[...new Set(state.sentences.map(topicOf))].map(t=>`<option value="${e(t)}" ${topic===t?'selected':''}>${e(t)}</option>`).join('')}</select><button class="secondary" id="export-sentences">${icon('download')} Export sentences</button></div><div class="grid"><section class="card"><span class="kicker">YOUR SENTENCE LIBRARY</span><h2 style="margin-top:12px">Useful words, in context.</h2><p class="small-note" style="margin-top:10px">${state.sentences.length} sentences. Ordered by frequencyRank. Starter ranks are illustrative priorities; import corpus ranks for measured frequency.</p><div class="library-list" id="library-list"></div></section><section class="card"><span class="kicker">GROW YOUR PLAYGROUND</span><h2 style="margin-top:12px">Paste more sentences.</h2><p class="small-note" style="margin-top:12px">Import a JSON array. IDs must be unique, and targetWord must occur exactly once as a whole word in polish. Identical IDs are skipped; conflicting IDs are rejected. Existing progress is preserved.</p><pre class="import-hint">${e(JSON.stringify([{id:'custom-001',polish:'Czekam na twoją odpowiedź.',english:'I am waiting for your answer.',targetWord:'odpowiedź',frequencyRank:120,grammarHint:'Accusative singular after czekać na.'}],null,2))}</pre><label class="sr-only" for="sentence-import">Paste sentence JSON</label><textarea class="import-area" id="sentence-import" maxlength="2000000" spellcheck="false" placeholder="Paste your JSON array here…"></textarea><div class="actions"><button class="primary" id="import-sentences">${icon('upload')} Add sentences</button></div><p class="small-note" id="import-result" role="status"></p><p class="small-note">Optional fields: grammarHint and topic. For Tatoeba, convert your selected sentence/translation pairs into this format and check their licensing and attribution requirements. This app does not fetch or claim to include Tatoeba content.</p></section></div>`;
 $('library-search').oninput=event=>{search=event.target.value;renderLibraryList();};$('topic-filter').onchange=event=>{topic=event.target.value;renderLibraryList();};$('export-sentences').onclick=()=>download(JSON.stringify(state.sentences,null,2),'lebw-polish-sentences.json');$('import-sentences').onclick=importSentences;renderLibraryList();
}
function renderLibraryList(){const found=state.sentences.filter(s=>(topic==='all'||topicOf(s)===topic)&&C.fold(`${s.polish} ${s.english} ${s.targetWord}`).includes(C.fold(search))).sort((a,b)=>a.frequencyRank-b.frequencyRank);$('library-list').innerHTML=found.length?found.map(s=>`<article class="library-item"><p lang="pl">${e(s.polish)}</p><small>${e(s.english)}</small><div class="meta-line"><span>${e(topicOf(s))} · priority ${s.frequencyRank}</span><span>${e(s.targetWord)} · mastery ${state.cards[s.id]?.level||0}/5</span></div></article>`).join(''):'<p class="empty">No matching sentences. Try another word or topic.</p>';reportHeight();}
function importSentences(){const result=$('import-result');try{const incoming=C.validateSentences(JSON.parse($('sentence-import').value)),existing=new Map(state.sentences.map(s=>[s.id,s]));let added=0,skipped=0;for(const s of incoming){const old=existing.get(s.id);if(old){if(['polish','english','targetWord','frequencyRank'].some(k=>old[k]!==s[k]))throw Error(`ID “${s.id}” already belongs to another sentence. Give the new sentence a different ID.`);skipped++;}else added++;}if(state.sentences.length+added>10000)throw Error('This library can hold up to 10,000 sentences.');state.sentences.push(...incoming.filter(s=>!existing.has(s.id)));save();result.textContent=`${added} added; ${skipped} identical entries skipped. Your existing progress is unchanged.`;$('sentence-import').value='';renderLibraryList();}catch(error){result.textContent=`Nothing imported. ${error.message}`;}}
function download(text,name){const blob=new Blob([text],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportBackup(){download(JSON.stringify({kind:'lebw-cloze-backup',version:1,exportedAt:new Date().toISOString(),state},null,2),`lebw-cloze-backup-${C.dayKey()}.json`);}
async function previewBackup(event){const file=event.target.files[0];if(!file)return;try{if(file.size>5000000)throw Error('Choose a backup smaller than 5 MB.');pendingBackup=C.validateBackup(await file.text());renderBackupPreview();}catch(error){pendingBackup=null;$('backup-preview').textContent=`Backup not loaded. ${error.message}`;}}
function renderBackupPreview(){if(!pendingBackup)return;$('backup-preview').innerHTML=`<div class="restore-review"><b>Review this backup before restoring</b><p>${pendingBackup.sentences.length} sentences · ${pendingBackup.stats.attempts} attempts · ${pendingBackup.stats.xp} XP.<br>This replaces only Cloze game data. Export your current game first if you want to keep both.</p><div class="actions"><button class="primary" id="confirm-restore">Restore this backup</button><button class="secondary" id="cancel-restore">Cancel</button></div></div>`;$('confirm-restore').onclick=()=>{stopTimer();state=pendingBackup;pendingBackup=null;choices=[];choiceId='';recoveryRaw=null;notice='Backup restored. Your other LEBWPOLISH activities were not changed.';save();render();};$('cancel-restore').onclick=()=>{pendingBackup=null;$('backup-preview').replaceChildren();};reportHeight();}
function reportHeight(){if(embedded)parent.postMessage({type:'LEBW_CLOZE_HEIGHT',height:Math.ceil(document.body.getBoundingClientRect().height)},location.origin);}
$('theme-toggle').onclick=()=>{state.settings.theme=state.settings.theme==='dark'?'light':'dark';save();renderChrome();};
document.querySelectorAll('[data-screen]').forEach(button=>button.onclick=()=>{screen=button.dataset.screen;window.speechSynthesis?.cancel();render();$('main').focus();});
document.addEventListener('keydown',event=>{if(event.repeat||event.isComposing||screen!=='play'||!ready)return;const tag=event.target.tagName;if(['TEXTAREA','SELECT'].includes(tag)||event.target.closest('nav'))return;if(state.session?.feedback&&event.key==='Enter'&&!['BUTTON','A','INPUT'].includes(tag)){event.preventDefault();next();return;}if(state.settings.mode==='choice'&&state.session?.queue.length&&!state.session.feedback&&/^[1-4]$/.test(event.key)&&tag!=='INPUT'){event.preventDefault();submit(choices[Number(event.key)-1]);}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopTimer();window.speechSynthesis?.cancel();}else if(screen==='play'&&state.session?.feedback)render();});
window.addEventListener('pagehide',()=>{stopTimer();window.speechSynthesis?.cancel();});
window.addEventListener('message',event=>{
 if(!embedded||event.source!==parent||event.origin!==location.origin)return;
 const message=event.data;if(!message||typeof message!=='object')return;
 if(message.type==='LEBW_CLOZE_INIT'||message.type==='LEBW_CLOZE_STATE'){
   account=message.account===true;saving=message.status||'saved';
   const changed=message.raw!==lastRaw||!ready;
   if(changed){try{load(message.raw);notice='';}catch{notice='The account’s Cloze save could not be read. Export a recovery copy before starting over.';recoveryRaw=message.raw;saving='error';}}
   ready=true;if(changed)render();else renderChrome();
 }else if(message.type==='LEBW_CLOZE_STATUS'){account=message.account===true;saving=message.status||'saved';renderChrome();}
});
if(embedded){parent.postMessage({type:'LEBW_CLOZE_READY'},location.origin);}else window.addEventListener('storage',event=>{if(event.key===C.KEY&&event.newValue&&event.newValue!==lastRaw){try{load(event.newValue);notice='Loaded the latest Cloze save from another tab.';render();}catch{notice='Another tab wrote an unreadable save. Your current run is still available for export.';renderChrome();}}});
if('ResizeObserver'in window)new ResizeObserver(reportHeight).observe(document.body);
render();
})();
</script>
</body></html>
